{% extends "base.html" %}{% block body %}<main class="wrap"><h1>{{ _('Новости') }}</h1><p class="sub">{{ _('Последние новости COLBA CLUBS') }}</p>{% for n in news_items %}<section class="panel"><h2>{{n.title}}</h2>{% if n.image_data %}<img src="{{ url_for('news_image', news_id=n.id) }}" alt="{{n.title}}" style="width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin:10px 0">{% endif %}<p style="white-space:pre-wrap">{{n.body}}</p><p class="muted">{{n.created_at}}</p></section>{% else %}<section class="panel"><p>{{ _('Пока новостей нет.') }}</p></section>{% endfor %}</main>{% endblock %}
