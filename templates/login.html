{% extends "base.html" %}{% block body %}<main class="login"><section class="panel"><h1>{{title}}</h1><form method="post" action="{{action}}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ _('Логин') }}</label><input name="login" required autocomplete="username"><label>{{ _('Пароль') }}</label><input name="password" type="password" required autocomplete="current-password"><button type="submit">{{ _('Войти') }}</button></form><p class="muted">Аккаунт пользователя выдаёт оператор.</p>{% if show_operator_link %}<p class="operator-entry"><a href="{{ url_for('operator_login') }}">{{ _('Вход оператора') }}</a></p>{% endif %}</section></main>{% endblock %}
