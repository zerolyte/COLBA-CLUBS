<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLBA CLUBS</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><div class="brand"><img src="{{ url_for('static',filename='colba-logo.png') }}" alt="COLBA Maktabi" class="brand-logo"><span class="brand-name">COLBA CLUBS</span></div><nav>{% if session.get('role') %}<a href="{{ url_for('logout') }}">Выйти</a>{% endif %}</nav></header>{% with messages=get_flashed_messages() %}{% if messages %}<div class="wrap">{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block body %}{% endblock %}</body></html>
